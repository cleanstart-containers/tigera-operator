apiVersion: v1
kind: Namespace
metadata:
  name: tigera-operator
  labels:
    app: tigera-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tigera-operator
  namespace: tigera-operator
  labels:
    app: tigera-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tigera-operator
  labels:
    app: tigera-operator
rules:
  # Core resources the operator needs
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - configmaps
      - events
      - namespaces
      - secrets
      - nodes
      - serviceaccounts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Calico/Tigera CRDs
  - apiGroups: ["crd.projectcalico.org"]
    resources:
      - "*"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["operator.tigera.io"]
    resources:
      - "*"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["projectcalico.org"]
    resources:
      - "*"
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Network policy resources
  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CRD management
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Admission webhooks
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tigera-operator
  labels:
    app: tigera-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tigera-operator
subjects:
  - kind: ServiceAccount
    name: tigera-operator
    namespace: tigera-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tigera-operator
  namespace: tigera-operator
  labels:
    app: tigera-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tigera-operator
  template:
    metadata:
      labels:
        app: tigera-operator
    spec:
      serviceAccountName: tigera-operator
      containers:
      - name: tigera-operator
        image: cleanstart/tigera-operator:latest-dev
        imagePullPolicy: IfNotPresent
        # Binary is located at /usr/bin/operator
        command: ["sh", "-c"]
        args:
          - |
            echo "Tigera Operator container started"
            echo "Binary: /usr/bin/operator"
            echo ""
            echo "Available flags:"
            /usr/bin/operator --help || /usr/bin/operator -h || true
            echo ""
            echo "Container is ready. Use 'kubectl exec' to run operator commands."
            echo "Example: kubectl exec -n tigera-operator <pod-name> -- /usr/bin/operator --help"
            echo ""
            # Keep container running
            while true; do
              sleep 3600
            done
        env:
        - name: SSL_CERT_FILE
          value: /etc/ssl/certs/ca-certificates.crt
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 9443
          name: webhook
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
              - sh
              - -c
              - "test -f /usr/bin/operator"
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
              - sh
              - -c
              - "test -f /usr/bin/operator"
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: false
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: tigera-operator
  namespace: tigera-operator
  labels:
    app: tigera-operator
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: metrics
  - port: 9443
    targetPort: 9443
    protocol: TCP
    name: webhook
  selector:
    app: tigera-operator

